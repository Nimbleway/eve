name: release

# Publishes @nimble-way/eve to npm via Trusted Publishing (OIDC, no API token)
# when a GitHub Release is published. The npm package's trusted publisher must be
# configured once by an admin (https://docs.npmjs.com/trusted-publishers),
# pointing at this repo, the `release.yml` workflow, and the `release`
# environment. The release tag must be vX.Y.Z and match the version in
# package.json.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# Only one publish run per ref; never cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      # Guard against publishing a version that doesn't match the release tag.
      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.event.release.tag_name }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG)"
            exit 1
          fi

      # Provenance is attached from the OIDC identity; no token is involved.
      - run: npm publish --access public --provenance
