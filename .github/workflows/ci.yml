name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm version comes from the packageManager field.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # The root prepare script builds dist/ via `eve extension build`.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      # Resolves the example agent with `eve info --json` and asserts the
      # extension contract (nimble__* tools, skill, web_search override).
      - run: node scripts/check-discovery.mjs

      - run: pnpm --filter nimble-eve-example-agent run typecheck
